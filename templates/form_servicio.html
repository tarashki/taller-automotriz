{% extends 'base.html' %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2>
            {% if servicio %}
            Editar
            {% else %}
            Nuevo
            {% endif %}
            Servicio
        </h2>
    </div>
    <div class="card-body">
        <form method="POST" action="">
            <div class="mb-3">
                <label class="form-label">Descripción</label>
                <input type="text" class="form-control" name="descripcion" value="{{ servicio.descripcion if servicio else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Precio</label>
                <input type="number" step="0.01" class="form-control" name="precio" value="{{ servicio.precio if servicio else '' }}" required>
            </div>
            <button class="btn btn-primary" type="submit">Enviar</button>
        </form>
    </div>
</div>
{% endblock %}
