{% extends 'base.html' %}

{% block content %}
<h2>Listado de Mantenimientos</h2>
<a href="{{ url_for('nuevo_mantenimiento') }}" class="btn btn-success mb-3">Nuevo Mantenimiento</a>

<table class="table table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>Servicio</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for item in mantenimientos %}
        <tr>
            <td>{{ item.id }}</td>
            <td>{{ item.fecha }}</td>
            <td>{{ item.cliente }}</td>
            <td>{{ item.servicio }}</td>
            <td>
                <a href="{{ url_for('editar_mantenimiento', id=item.id) }}" class="btn btn-warning btn-sm">Editar</a>
                <a href="{{ url_for('eliminar_mantenimiento', id=item.id) }}" class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar mantenimiento?');">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
