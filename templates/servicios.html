{% extends 'base.html' %}

{% block content %}
<h2>Listado de Servicios</h2>
<a href="{{ url_for('nuevo_servicio') }}" class="btn btn-success mb-3">Nuevo Servicio</a>

<table class="table table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Descripción</th>
            <th>Precio (BS)</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for item in servicios %}
        <tr>
            <td>{{ item.id }}</td>
            <td>{{ item.descripcion }}</td>
            <td>{{ item.precio }}</td>
            <td>
                <a href="{{ url_for('editar_servicio', id=item.id) }}" class="btn btn-warning btn-sm">Editar</a>
                <a href="{{ url_for('eliminar_servicio', id=item.id) }}" class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar servicio?');">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
